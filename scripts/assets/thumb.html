<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- Fallback chapter thumbnail (16:9) for hồi without a YouTube thumbnail. Query: ?n=21&title=...&hook=...&series=... -->
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Playfair+Display:wght@800;900&display=block&subset=vietnamese" rel="stylesheet">
<style>
  html, body { margin: 0; width: 640px; height: 360px; overflow: hidden; }
  body {
    position: relative; font-family: 'Be Vietnam Pro', sans-serif; color: #ffe3a3;
    background:
      radial-gradient(160px 160px at 74% 42%, rgba(255, 214, 140, .55), transparent 70%),
      radial-gradient(420px 260px at 74% 42%, rgba(160, 170, 210, .22), transparent 70%),
      linear-gradient(180deg, #0e1226 0%, #1d2140 55%, #12142a 100%);
  }
  svg { position: absolute; inset: auto 0 0 0; width: 100%; height: 62%; }
  .moon { position: absolute; left: 74%; top: 42%; width: 34px; height: 34px; margin: -17px; border-radius: 50%; background: #ffd58f; filter: blur(2px); box-shadow: 0 0 40px 18px rgba(255, 200, 120, .35); }
  .wrap { position: absolute; inset: 24px 28px; display: flex; flex-direction: column; }
  .top { display: flex; gap: 14px; align-items: center; }
  .badge { background: #c62b26; color: #fff; font-weight: 600; font-size: 22px; padding: 4px 14px; border-radius: 8px; }
  .series { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 22px; letter-spacing: 1px; color: #e9c27a; }
  h1 { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 60px; line-height: 1.02; margin: 18px 0 0; max-width: 78%;
       color: #ffe3a3; text-transform: uppercase; -webkit-text-stroke: 2px #2a1306; paint-order: stroke fill; text-shadow: 0 4px 0 #1a0b03; }
  .hook { margin-top: auto; align-self: flex-start; background: #000; color: #fff; font-size: 22px; padding: 4px 12px; font-weight: 600; }
  .brand { position: absolute; right: 24px; bottom: 14px; font-family: 'Playfair Display', serif; font-weight: 800; font-size: 14px; color: #f3e1b5; }
</style>
</head>
<body>
<div class="moon"></div>
<svg viewBox="0 0 640 220" preserveAspectRatio="none">
  <path d="M0 120 L60 80 L120 110 L190 50 L250 100 L330 40 L400 95 L470 60 L540 110 L640 70 V220 H0Z" fill="#2c3052" opacity=".75"/>
  <path d="M0 170 L80 120 L150 150 L230 100 L300 150 L380 110 L460 160 L560 120 L640 150 V220 H0Z" fill="#1b1d36"/>
  <path d="M0 200 Q160 170 320 195 T640 190 V220 H0Z" fill="#0d0e1e"/>
</svg>
<div class="wrap">
  <div class="top"><span class="badge" id="n"></span><span class="series" id="s"></span></div>
  <h1 id="t"></h1>
  <span class="hook" id="h"></span>
</div>
<span class="brand">Hàn Lão Đọc Truyện</span>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('n').textContent = 'HỒI ' + (q.get('n') || '');
  document.getElementById('s').textContent = (q.get('series') || 'Tàn Đăng Ký').toUpperCase();
  document.getElementById('t').textContent = q.get('title') || '';
  const h = q.get('hook');
  if (h) document.getElementById('h').textContent = h; else document.getElementById('h').remove();
</script>
</body>
</html>
